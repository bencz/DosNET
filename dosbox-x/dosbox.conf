# DOSBox-X configuration file for DosNET testing
# Use with: dosbox-x -conf dosbox.conf

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=640x400
output=surface
autolock=false
sensitivity=100
waitonerror=false
priority=higher,normal
mapperfile=mapper-dosbox-x.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=64
memsizekb=0
dos mem limit=0
ems=true
umb=true
ver=7.1

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=pentium
cycles=max
cycleup=10
cycledown=20
turbo=true

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[midi]
mpu401=intelligent
mididevice=default
midiconfig=

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100
disney=true

[joystick]
joysticktype=auto
timed=true
autofire=false
swap34=false
buttonwrap=false

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
# Lines in this section will be run at startup.
# Mount the DosNET drive_c directory as C:
MOUNT C /Users/bencz/programming/DosNET/dosbox-x/drive_c

# Set PATH to include MASM and HX
SET PATH=C:\MASM611\BIN;C:\HX\BIN;%PATH%

# Change to C: drive
C:
CD \OUTPUT
